<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanternfall</title>
<style>
  html, body { margin: 0; height: 100%; background: #05040a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); background: #05040a; cursor: crosshair; display: block; }
  .shot body { display: block; overflow: visible; }
  .shot #game { width: 1280px; height: 720px; }
  #sim { color: #9f9; font: 12px monospace; position: fixed; top: 0; left: 0; margin: 0; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Lanternfall, a game of light against shadow"></canvas>
<script type="module" src="src/main.js"></script>
